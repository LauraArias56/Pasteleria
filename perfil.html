<!DOCTYPE html>
<html lang="es">
<head>

  <title>Perfil de Usuario</title>

  <link rel="stylesheet" href="Css/Style.Css">

<body>
 <div class="d-flex">

    </div>

  </div>


    <!-- PERFIL -->
    <div class="flex-grow-1 p-5 text-center">

      <h4>NAME</h4>
       <p class="parra-per">APELLIDO<br>CEDULA<br>CORREO<br>NUM CELULAR<br>DIRECCIÓN</p>

 <div class="text-center py-2 bg-light">
<div class="footer-container">
